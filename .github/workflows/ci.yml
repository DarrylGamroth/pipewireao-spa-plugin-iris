name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock:
    name: Iris v0.2.4 and PipeWireAO in-tree mock
    runs-on: ubuntu-24.04
    container:
      image: docker.io/library/debian@sha256:7378260c0a098d27ac206225db5e7d92b8c7c84ea7afccc86eeb513756bbd392 # Debian 13
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      IRIS_DEB: iris-gentl_0.2.4_debian13_amd64.deb
      PIPEWIREAO_TARBALL: PipeWireAO.v4.0.5.x86_64-linux-gnu.tar.gz
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake curl g++ gcovr git gnupg libarchive-dev libxml2-dev meson ninja-build pkgconf python3

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: DarrylGamroth/iris-gentl
          ref: 4b59b46496de4ba334f9647b20a98ced9ee3666e
          path: iris-source
          persist-credentials: false

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: DarrylGamroth/clprotocol-gentl
          ref: 86dc386d5ec6cc39ceba9ae7ed2e8882fb8fbe81
          path: clprotocol-source
          persist-credentials: false

      - name: Install and verify Iris v0.2.4 and PipeWireAO v4.0.5
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 --output "$IRIS_DEB" \
            "https://github.com/DarrylGamroth/iris-gentl/releases/download/v0.2.4/$IRIS_DEB"
          printf '%s  %s\n' 8051756af554c91c114441b97401722b726566101f07a2a1b0be3e51bf1858fa "$IRIS_DEB" \
            | sha256sum --strict --check -
          apt-get install -y --no-install-recommends "./$IRIS_DEB"
          test "$(dpkg-query -W -f='${Version}' iris-gentl)" = 0.2.4

          curl --fail --silent --show-error --location --retry 3 --output "$PIPEWIREAO_TARBALL" \
            "https://github.com/DarrylGamroth/PipeWireAO_jll.jl/releases/download/PipeWireAO-v4.0.5+0/$PIPEWIREAO_TARBALL"
          printf '%s  %s\n' 3ec7fa12811af376adeebb85985b552a13752cdf95a9c1bc6f42aaa2fb4f1828 "$PIPEWIREAO_TARBALL" \
            | sha256sum --strict --check -
          mkdir "$RUNNER_TEMP/pipewireao"
          tar -xzf "$PIPEWIREAO_TARBALL" -C "$RUNNER_TEMP/pipewireao"
          LD_LIBRARY_PATH="$RUNNER_TEMP/pipewireao/lib" "$RUNNER_TEMP/pipewireao/bin/pipewire-ao" --version \
            | grep -Fx 'Linked with libpipewire 4.0.5'

      - name: Build the in-tree CTI
        run: |
          cmake -G Ninja -S iris-source -B "$RUNNER_TEMP/iris-mock" \
            -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/iris-mock" --target iris-test-cti --parallel

      - name: Build the paired-control fixture
        run: |
          cmake -G Ninja -S clprotocol-source -B "$RUNNER_TEMP/control" -DBUILD_TESTING=ON
          cmake --build "$RUNNER_TEMP/control" --parallel

      - name: Test scalar and stacked capture and held-buffer lifetime
        id: tests
        run: |
          pipewireao="$RUNNER_TEMP/pipewireao"
          export PKG_CONFIG_PATH="$pipewireao/lib/pkgconfig"
          export LD_LIBRARY_PATH="$pipewireao/lib"
          meson setup build-coverage -Db_coverage=true -Dwerror=true -Dtest-held-buffer=true \
            -Diris-prefix=/usr -Diris-libdir=/usr/lib/x86_64-linux-gnu \
            -Dtest-mock-cti="$RUNNER_TEMP/iris-mock/iris-test-cti.cti" \
            -Dtest-pipewireao-bindir="$pipewireao/bin" \
            -Dtest-control-cti="$RUNNER_TEMP/control/clprotocol-gentl.cti" \
            -Dtest-clserial="$RUNNER_TEMP/control/tests/libmock-clserial.so" \
            -Dtest-clprotocol-gentl-config="$RUNNER_TEMP/control/tests/ports.tsv"
          meson compile -C build-coverage
          meson test -C build-coverage --print-errorlogs
          IRIS_MOCK_STACKED_INFO=1 meson test -C build-coverage --print-errorlogs

      - name: Collect native coverage
        run: |
          gcovr --root . --lcov build-coverage/coverage-c.info --print-summary build-coverage
          sed -i "s|^SF:${PWD}/|SF:|" build-coverage/coverage-c.info
          grep -Eq '^LF:[1-9]' build-coverage/coverage-c.info

      - name: Save coverage reports and test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-and-coverage
          path: |
            build-coverage/coverage-*.info
            build-coverage/meson-logs/testlog.txt

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('build-coverage/coverage-*.info') != '' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          use_oidc: true
          disable_search: true
          files: build-coverage/coverage-c.info
          fail_ci_if_error: true

      - name: Require more than 90% line coverage
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          for report in build-coverage/coverage-c.info; do
            awk -F: '
              $1 == "LF" { found += $2 }
              $1 == "LH" { hit += $2 }
              END {
                if (found == 0) {
                  print FILENAME ": empty line coverage report"
                  exit 1
                }
                printf "%s: %.2f%% line coverage (%d/%d)\n", FILENAME, 100 * hit / found, hit, found
                exit !(100 * hit > 90 * found)
              }
            ' "$report" || failed=1
          done
          exit "${failed:-0}"
