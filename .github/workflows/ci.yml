name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mock:
    name: Iris v0.2.4 and PipeWireAO in-tree mock
    runs-on: ubuntu-24.04
    container:
      image: docker.io/library/debian@sha256:7378260c0a098d27ac206225db5e7d92b8c7c84ea7afccc86eeb513756bbd392 # Debian 13
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      IRIS_DEB: iris-gentl_0.2.4_debian13_amd64.deb
      PIPEWIREAO_TARBALL: PipeWireAO.v4.0.5.x86_64-linux-gnu.tar.gz
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake curl g++ git libarchive-dev libxml2-dev meson ninja-build pkgconf python3

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: DarrylGamroth/iris-gentl
          ref: 4b59b46496de4ba334f9647b20a98ced9ee3666e
          path: iris-source
          persist-credentials: false

      - name: Install and verify Iris v0.2.4 and PipeWireAO v4.0.5
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 --output "$IRIS_DEB" \
            "https://github.com/DarrylGamroth/iris-gentl/releases/download/v0.2.4/$IRIS_DEB"
          printf '%s  %s\n' 8051756af554c91c114441b97401722b726566101f07a2a1b0be3e51bf1858fa "$IRIS_DEB" \
            | sha256sum --strict --check -
          apt-get install -y --no-install-recommends "./$IRIS_DEB"
          test "$(dpkg-query -W -f='${Version}' iris-gentl)" = 0.2.4

          curl --fail --silent --show-error --location --retry 3 --output "$PIPEWIREAO_TARBALL" \
            "https://github.com/DarrylGamroth/PipeWireAO_jll.jl/releases/download/PipeWireAO-v4.0.5+0/$PIPEWIREAO_TARBALL"
          printf '%s  %s\n' 3ec7fa12811af376adeebb85985b552a13752cdf95a9c1bc6f42aaa2fb4f1828 "$PIPEWIREAO_TARBALL" \
            | sha256sum --strict --check -
          mkdir "$RUNNER_TEMP/pipewireao"
          tar -xzf "$PIPEWIREAO_TARBALL" -C "$RUNNER_TEMP/pipewireao"
          LD_LIBRARY_PATH="$RUNNER_TEMP/pipewireao/lib" "$RUNNER_TEMP/pipewireao/bin/pipewire-ao" --version \
            | grep -Fx 'Linked with libpipewire 4.0.5'

      - name: Build the in-tree CTI
        run: |
          cmake -G Ninja -S iris-source -B "$RUNNER_TEMP/iris-mock" \
            -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/iris-mock" --target iris-test-cti --parallel

      - name: Test scalar and stacked capture and held-buffer lifetime
        run: |
          pipewireao="$RUNNER_TEMP/pipewireao"
          export PKG_CONFIG_PATH="$pipewireao/lib/pkgconfig"
          export LD_LIBRARY_PATH="$pipewireao/lib"
          meson setup "$RUNNER_TEMP/plugin" -Dwerror=true -Dtest-held-buffer=true \
            -Diris-prefix=/usr -Diris-libdir=/usr/lib/x86_64-linux-gnu \
            -Dtest-mock-cti="$RUNNER_TEMP/iris-mock/iris-test-cti.cti" \
            -Dtest-pipewireao-bindir="$pipewireao/bin"
          meson compile -C "$RUNNER_TEMP/plugin"
          meson test -C "$RUNNER_TEMP/plugin" --print-errorlogs
          IRIS_MOCK_STACKED_INFO=1 meson test -C "$RUNNER_TEMP/plugin" --print-errorlogs
