# Set the CTI path and device selector before adding this to pipewire.conf.d.
# Merge the polling loop into any existing context.data-loops list.
context.spa-libs = {
    api.iris.* = iris/libspa-iris
}

context.properties = {
    context.data-loops = [
        { loop.name = ordinary loop.class = data.rt loop.idle = eventfd }
        { loop.name = iris loop.class = data.rt loop.idle = busy-spin }
    ]
}

context.objects = [
    { factory = spa-node-factory
      args = {
        factory.name = api.iris.source
        node.name = iris-camera
        node.description = "Iris GenTL camera"
        node.loop.name = iris
        api.iris.producer = "/absolute/path/to/producer.cti"
        # api.iris.serial-number = "CAMERA-SERIAL"
        # api.iris.initial-controls = [ "AcquisitionMode" "Continuous" "ExposureTime" "2000" ]
      }
    }
]
